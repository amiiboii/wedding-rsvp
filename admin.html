<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · RSVP Backup</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Raleway:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#faf5ee;--text:#2a1c10;--text2:#7a6248;--gold:#b89060;--goldA:rgba(184,144,96,.32)}
body{background:var(--bg);color:var(--text);font-family:'Raleway',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}

.gate{text-align:center;padding:3rem 2rem}
.gate h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:1.8rem;margin-bottom:1.5rem;letter-spacing:.15em}
.gate input{display:block;width:260px;margin:0 auto .8rem;padding:.7rem 1rem;border:1px solid rgba(42,28,16,.25);background:rgba(255,255,255,.4);font-family:'Raleway',sans-serif;font-size:.85rem;text-align:center;outline:none;transition:border-color .3s}
.gate input:focus{border-color:var(--gold)}
.gate button{padding:.7rem 2.5rem;border:1.5px solid var(--text);background:transparent;color:var(--text);font-family:'Raleway',sans-serif;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;cursor:pointer;transition:all .3s}
.gate button:hover{background:var(--text);color:var(--bg)}
.gate .err{color:#c44;font-size:.75rem;margin:1rem auto 0;max-width:420px;line-height:1.6}
.err-box{padding:1.2rem 1.4rem;border:1px solid rgba(180,60,60,.35);background:rgba(180,60,60,.05);color:#7a2a2a;font-size:.8rem;line-height:1.7}

.dashboard{display:none;width:100%;max-width:1100px;padding:2rem;margin:0 auto}
.dashboard.show{display:block}
.dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;flex-wrap:wrap;gap:1rem}
.dash-header h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:1.6rem;letter-spacing:.1em}
.dash-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.dash-btn{padding:.55rem 1.5rem;border:1px solid var(--text);background:transparent;color:var(--text);font-family:'Raleway',sans-serif;font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .3s}
.dash-btn:hover{background:var(--text);color:var(--bg)}
.dash-btn.gold{border-color:var(--gold);color:var(--gold)}
.dash-btn.gold:hover{background:var(--gold);color:#fff}

.stats{display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}
.stat{padding:1rem 1.4rem;border:1px solid var(--goldA);text-align:center;min-width:80px;flex:1}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:500;color:var(--gold)}
.stat-label{font-size:.5rem;letter-spacing:.25em;text-transform:uppercase;color:var(--text2);margin-top:.2rem}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.78rem;min-width:600px}
thead{background:rgba(42,28,16,.06)}
th{font-size:.5rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text2);padding:.8rem .6rem;text-align:left;border-bottom:1px solid var(--goldA);white-space:nowrap}
td{padding:.7rem .6rem;border-bottom:1px solid rgba(42,28,16,.08);vertical-align:top}
tr:hover{background:rgba(184,144,96,.06)}
.badge{display:inline-block;padding:.15rem .5rem;border-radius:2px;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.badge-yes{background:rgba(76,145,65,.12);color:#3a7a2e}
.badge-no{background:rgba(180,60,60,.1);color:#a33}
.badge-maybe{background:rgba(184,144,96,.15);color:#8a6a30}
.del-btn{padding:.3rem .7rem;border:1px solid #c44;background:transparent;color:#c44;font-family:'Raleway',sans-serif;font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .3s;white-space:nowrap}
.del-btn:hover{background:#c44;color:#fff}
.empty{text-align:center;padding:3rem;color:var(--text2);font-style:italic}
.loading{text-align:center;padding:2rem;color:var(--text2);font-size:.8rem}

.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(42,28,16,.5);z-index:100;align-items:center;justify-content:center}
.confirm-overlay.show{display:flex}
.confirm-box{background:var(--bg);padding:2rem;text-align:center;max-width:340px;width:90%;box-shadow:0 12px 40px rgba(42,28,16,.2)}
.confirm-box p{font-size:.85rem;margin-bottom:1.2rem;line-height:1.6}
.confirm-box .cb-actions{display:flex;gap:.8rem;justify-content:center}

/* MOBILE */
@media(max-width:640px){
  .dashboard{padding:1rem .8rem}
  .dash-header{flex-direction:column;align-items:flex-start}
  .dash-header h1{font-size:1.2rem}
  .dash-actions{width:100%}
  .dash-btn{flex:1;text-align:center;padding:.5rem .6rem;font-size:.48rem;letter-spacing:.15em}
  .stats{gap:.6rem}
  .stat{padding:.8rem .6rem;min-width:0}
  .stat-num{font-size:1.5rem}
  .stat-label{font-size:.42rem;letter-spacing:.18em}
  table{font-size:.7rem}
  th{padding:.6rem .4rem;font-size:.42rem}
  td{padding:.5rem .4rem}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <h1>Admin Access</h1>
  <input type="password" id="pw" placeholder="Enter password" autocomplete="off">
  <button id="pw-btn">Enter</button>
  <p class="err" id="pw-err"></p>
</div>

<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <h1>RSVP Backup Dashboard</h1>
    <div class="dash-actions">
      <button class="dash-btn" id="refresh-btn">Refresh</button>
      <button class="dash-btn gold" id="download-btn">Download JSON</button>
      <button class="dash-btn" id="logout-btn">Logout</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="table-wrap" id="table-wrap">
    <p class="loading" id="loading">Loading RSVPs...</p>
  </div>
</div>

<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <p id="confirm-msg">Remove this entry?</p>
    <div class="cb-actions">
      <button class="dash-btn" id="confirm-yes">Remove</button>
      <button class="dash-btn" id="confirm-no">Cancel</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js';
import { getDatabase, ref, onValue, remove } from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyDjDMjVXc7ubHJK0EvusYnxhA4RjeFBeQU",
  authDomain: "bisaru2026.firebaseapp.com",
  databaseURL: "https://bisaru2026-default-rtdb.firebaseio.com",
  projectId: "bisaru2026",
  storageBucket: "bisaru2026.firebasestorage.app",
  messagingSenderId: "454196774978",
  appId: "1:454196774978:web:2ef63c7f5a1f65466785db"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const $ = id => document.getElementById(id);

let allRSVPs = [];
let pendingDeleteId = null;
let unsubscribe = null;

function checkPw() {
  if ($('pw').value === 'bisaru2026') {
    $('pw-err').textContent = '';
    $('gate').style.display = 'none';
    $('dashboard').classList.add('show');
    loadData();
  } else {
    $('pw-err').textContent = 'Incorrect password';
  }
}

$('pw-btn').addEventListener('click', checkPw);
$('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPw();
});

function loadData() {
  if (unsubscribe) unsubscribe();
  $('table-wrap').innerHTML = '<p class="loading">Loading RSVPs...</p>';
  unsubscribe = onValue(ref(db, 'rsvps'), snapshot => {
    allRSVPs = [];
    snapshot.forEach(child => {
      allRSVPs.push({ id: child.key, ...child.val() });
    });
    allRSVPs.reverse();
    renderStats();
    renderTable();
  }, err => {
    unsubscribe = null;
    const box = document.createElement('div');
    box.className = 'err-box';
    box.textContent = /permission/i.test(String(err && (err.code || err.message)))
      ? 'Permission denied by the Firebase Realtime Database rules (Firebase console → Realtime Database → Rules — see database.rules.json). The Google Sheet backup still has every RSVP.'
      : 'Error loading data: ' + (err && err.message ? err.message : err);
    $('stats').innerHTML = '';
    $('table-wrap').replaceChildren(box);
  });
}

function renderStats() {
  const count = v => allRSVPs.filter(r => r.attendance === v).length;
  const stats = [[allRSVPs.length, 'Total'], [count('yes'), 'Accepted'], [count('no'), 'Declined'], [count('maybe'), 'Tentative']];
  $('stats').replaceChildren(...stats.map(([n, label]) => {
    const s = document.createElement('div'); s.className = 'stat';
    const num = document.createElement('div'); num.className = 'stat-num'; num.textContent = n;
    const lab = document.createElement('div'); lab.className = 'stat-label'; lab.textContent = label;
    s.append(num, lab);
    return s;
  }));
}

// Built with textContent (not innerHTML) so a guest's name or message can never run code here.
function renderTable() {
  const wrap = $('table-wrap');
  if (allRSVPs.length === 0) {
    wrap.innerHTML = '<p class="empty">No RSVPs yet</p>';
    return;
  }

  const badgeClass = v => v === 'yes' ? 'badge-yes' : v === 'no' ? 'badge-no' : 'badge-maybe';
  const badgeText = v => v === 'yes' ? 'Accepts' : v === 'no' ? 'Declines' : 'Tentative';
  const cell = (text) => { const td = document.createElement('td'); td.textContent = text; return td; };

  const table = document.createElement('table');
  table.innerHTML = '<thead><tr><th>#</th><th>Name</th><th>Phone</th><th>Status</th><th>Message</th><th>Date</th><th></th></tr></thead>';
  const tbody = document.createElement('tbody');
  allRSVPs.forEach((r, i) => {
    const d = r.timestamp ? new Date(r.timestamp).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '-';
    const tr = document.createElement('tr');
    const status = document.createElement('td');
    const badge = document.createElement('span');
    badge.className = 'badge ' + badgeClass(r.attendance);
    badge.textContent = badgeText(r.attendance);
    status.append(badge);
    const act = document.createElement('td');
    const del = document.createElement('button');
    del.className = 'del-btn';
    del.textContent = 'Remove';
    del.addEventListener('click', () => askDelete(r.id, r.name || 'this entry'));
    act.append(del);
    tr.append(cell(i + 1), cell(r.name || '-'), cell(r.phone || '-'), status, cell(r.message || '-'), cell(d), act);
    tbody.append(tr);
  });
  table.append(tbody);
  wrap.replaceChildren(table);
}

function askDelete(id, name) {
  pendingDeleteId = id;
  $('confirm-msg').textContent = 'Remove RSVP from "' + name + '"?';
  $('confirm-overlay').classList.add('show');
}

$('confirm-yes').addEventListener('click', () => {
  if (pendingDeleteId) {
    remove(ref(db, 'rsvps/' + pendingDeleteId)).catch(err => alert('Could not remove: ' + err.message));
    pendingDeleteId = null;
  }
  $('confirm-overlay').classList.remove('show');
});

$('confirm-no').addEventListener('click', () => {
  pendingDeleteId = null;
  $('confirm-overlay').classList.remove('show');
});

$('refresh-btn').addEventListener('click', loadData);

$('download-btn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(allRSVPs, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rsvp-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
});

$('logout-btn').addEventListener('click', () => {
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }
  $('dashboard').classList.remove('show');
  $('gate').style.display = 'block';
  $('pw').value = '';
});
</script>
</body>
</html>
